plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
    // Required Stripe dependency
    implementation 'com.stripe:stripe-android:20.15.3'

    // Core dependencies for Android app compatibility
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.fragment:fragment:1.5.7'

    // Optional annotations to avoid potential runtime issues
    implementation 'com.google.errorprone:error_prone_annotations:2.19.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // 🔥 Desugaring dependency (required for flutter_local_notifications)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}

android {
    namespace "com.example.zinzi2"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.zinzi2"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Ensure viewBinding is enabled for Stripe
    viewBinding {
        enabled = true
    }
}

flutter {
    source = "../.."
}
apply plugin: 'com.google.gms.google-services'