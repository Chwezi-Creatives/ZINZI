plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
    // Required Stripe dependency
    implementation 'com.stripe:stripe-android:20.15.3'

    // Core dependencies for Android app compatibility
    implementation 'androidx.activity:activity:1.6.1'
    implementation 'androidx.fragment:fragment:1.5.7'

    // Optional annotations to avoid potential runtime issues
    implementation 'com.google.errorprone:error_prone_annotations:2.19.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

android {
    namespace = "com.example.zinzi2"
    compileSdk = flutter.compileSdkVersion // Ensure this matches the latest compile SDK version

    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8" // Ensure compatibility with Java 8
    }

    defaultConfig {
        applicationId = "com.example.zinzi2"
        minSdk = flutter.minSdkVersion // Ensure the minSdk aligns with Stripe requirements (minSdk = 21 recommended)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signing config (use debug for development; update for production)
            signingConfig = signingConfigs.debug
            minifyEnabled true // Set to true for production with proper ProGuard rules
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Ensure viewBinding is enabled for Stripe
    viewBinding {
        enabled = true
    }
}

flutter {
    source = "../.."
}
